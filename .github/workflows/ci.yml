name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: No unused modules
        run: npm run check:unused
      - name: Unit tests
        run: npm test
      # dates are Prague days: the same tests on the other side of the world (UTC+14) catch device-time-zone bugs
      - name: Unit tests in UTC+14
        run: npm test
        env:
          TZ: Pacific/Kiritimati
      - name: Database migrations (throwaway Postgres)
        run: npm run test:migrations
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (builds into .next-test)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
